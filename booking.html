<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Ticket - RailStream</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <div class="nav-container">
            <h2 id="logo"><img src="train.png" alt="Logo"> IRCTC Railway</h2>
            <div>
                <a href="user-dashboard.html">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>🎟 Ticket Booking</h2>
            <form action="book.php" method="POST">
                <div class="form-group">
                    <label>Passenger Name</label>
                    <input type="text" name="passenger_name" placeholder="Full Name" required>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Age</label>
                        <input type="number" name="age" placeholder="Age" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Gender</label>
                        <select name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="10-digit mobile number" required>
                </div>
                <div class="form-group">
                    <label>Select Train</label>
                    <select name="train" required>
                        <option value="12423">Rajdhani Express (12423)</option>
                        <option value="12002">Shatabdi Express (12002)</option>
                        <option value="12133">Superfast Express (12133)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Seat Number (Optional)</label>
                    <input type="text" name="seat" placeholder="Auto-assign if left blank">
                </div>
                <button type="submit">Submit Booking</button>
            </form>
        </div>
    </div>
</body>

</html>
