<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RailStream</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <div class="nav-container">
            <h2 id="logo"><img src="train.png" alt="Logo"> IRCTC Railway</h2>
            <div>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h2 style="margin-bottom: 20px;">Create New Account</h2>
            <form action="register.php" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullname" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="Enter 10-digit mobile number" required
                        pattern="[0-9]{10}">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a password" required>
                </div>
                <button type="submit">Register</button>
                <p style="margin-top: 15px; font-size: 14px;">
                    Already have an account? <a href="login.html"
                        style="color: var(--primary); font-weight: bold; text-decoration: none;">Login here</a>
                </p>
            </form>
        </div>
    </div>
</body>

</html>
